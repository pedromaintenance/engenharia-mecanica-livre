name: Ciclo 12 — dois solvers FEM Q8 e tensao de contorno

on:
  push:
    branches: [main]
    paths:
      - "src/engmec/fem2d_indep.py"
      - "src/engmec/gmsh_chapa.py"
      - "tests/test_fem2d_indep.py"
      - "tests/test_aval_ciclo12.py"
      - "scripts/avaliar_ciclo12.py"
      - ".github/workflows/ciclo12-dois-solvers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Gmsh, CalculiX, NumPy e SciPy e registrar versoes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gmsh calculix-ccx
          python -m pip install -e .
          python -m pip install "numpy>=1.26,<3" "scipy>=1.12,<2"
          dpkg-query -W gmsh calculix-ccx
          python -c 'import numpy, scipy; print("numpy",numpy.__version__,"scipy",scipy.__version__)'
          mkdir -p build/ciclo12
          python -m pip freeze > build/ciclo12/pip-freeze.txt
      - name: Testes unitarios de Q8, derivadas e patch test
        run: |
          python -m unittest discover -s tests -p 'test_fem2d_indep.py' -v
          python -m unittest discover -s tests -p 'test_aval_ciclo12.py' -v
      - name: Resolver a mesma chapa e malha Gmsh em 2 formulacoes FEM
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          for H in 4 8; do
            width=$(python -c 'import sys; print(float(sys.argv[1])*.01)' "$H")
            for n in 16 24; do
              python -m engmec.gmsh_chapa --nr "$n" --nt "$((2*n))" \
                --semilargura-m "$width" --saida "build/ciclo12/calculix/ha-$H-n-$n"
              python -m engmec.fem2d_indep --nr "$n" --nt "$((2*n))" \
                --semilargura-m "$width" --saida "build/ciclo12/scipy/ha-$H-n-$n"
            done
          done
      - name: Conferir hash da malha e comparar Kt, reacoes e convergencia
        run: python scripts/avaliar_ciclo12.py --pasta build/ciclo12
      - name: Arquivar codigo-fonte de entrada, MSH, INP, DAT, FRD, JSON e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciclo12-dois-solvers-fem
          path: build/ciclo12/
          retention-days: 30
          if-no-files-found: warn
