name: Benchmark externo CalculiX C3D8

on:
  push:
    branches: [main]
    paths:
      - "src/engmec/calculix.py"
      - "src/engmec/fem_barra.py"
      - "tests/test_calculix.py"
      - ".github/workflows/calculix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculix-3d:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar CalculiX do repositório Ubuntu 24.04
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y calculix-ccx
          dpkg-query -W calculix-ccx
          dpkg -L calculix-ccx | grep -E '/ccx(_[0-9.]+)?$' || true
      - name: Instalar código autoral
        run: python -m pip install -e .
      - name: Testes de geração e interpretação
        run: python -m unittest discover -s tests -p 'test_calculix.py' -v
      - name: Executar 4 malhas C3D8 reais no CalculiX
        env:
          OMP_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          for nx in 1 2 4 8; do
            python -m engmec.calculix --nx "$nx" --ny 2 --nz 2 --saida "build/calculix/nx-$nx" --tolerancia 0.02
          done
      - name: Arquivar entradas, logs e resultados do solver
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculix-c3d8-ubuntu2404
          path: |
            build/calculix/
          if-no-files-found: warn
          retention-days: 30
