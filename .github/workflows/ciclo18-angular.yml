name: Ciclo 18 — redistribuicao angular Q8 e controle da parede livre

on:
  push:
    branches: [main]
    paths:
      - "src/engmec/angular_transfinite.py"
      - "src/engmec/elmer_chapa.py"
      - "scripts/avaliar_ciclo18.py"
      - "tests/test_angular_transfinite.py"
      - "tests/test_aval_ciclo18.py"
      - ".github/workflows/ciclo18-angular.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  smoke-cad:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Gmsh para auditoria CAD
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gmsh
          python -m pip install -e .
      - name: Testes basicos de CAD e regressao do padrão reta
        run: |
          python -m unittest discover -s tests -p 'test_angular_transfinite.py' -v
          python -m unittest discover -s tests -p 'test_progressao_radial.py' -v
      - name: Verificar quatro distribuicoes angulares sem inversao Q8
        run: |
          python - <<'PY'
          import pathlib,subprocess,tempfile
          from engmec.elmer_chapa import geo_elmer
          from engmec.convergencia_malha import qualidade_geometrica
          for ha in (4,8):
            for lw in (2,4):
              H=ha*.01;L=H*lw;n=24
              with tempfile.TemporaryDirectory() as tmp:
                p=pathlib.Path(tmp)
                (p/"model.geo").write_text(geo_elmer(nr=n,nt=2*n,H=H,L=L,a=.01,
                  estrategia_progressao="escalonada",angular="ampliada-topo"))
                proc=subprocess.run(["gmsh","model.geo","-2","-order","2","-format","msh2",
                   "-o","model.msh"],cwd=p,capture_output=True,text=True)
                if proc.returncode:
                  raise RuntimeError(proc.stderr[-2000:])
                q=qualidade_geometrica(p/"model.msh",a=.01,H=H,L=L,nr=n,nt=2*n)
                print(f"ha={ha} L/W={lw} n24 Q8={q['elementos']} min_angle={q['angulo_minimo_vertices_graus_geral']:.2f}")
          PY

  solver:
    needs: smoke-cad
    strategy:
      fail-fast: false
      matrix:
        ha: [4,8]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gmsh
          python -m pip install -e ".[elmer]"
          python -m pip freeze > pip-freeze-elmer.txt
          gmsh -version
      - name: Instalar Elmer externo no container e registrar digest
        run: |
          docker pull ghcr.io/femforge-io/femforge-elmer:0.2.0
          docker image inspect ghcr.io/femforge-io/femforge-elmer:0.2.0 --format '{{index .RepoDigests 0}}' > elmer-image-digest.txt
          mkdir -p /tmp/engmec-elmer-bin
          cat > /tmp/engmec-elmer-bin/ElmerGrid <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work \
            ghcr.io/femforge-io/femforge-elmer:0.2.0 ElmerGrid "$@"
          EOF
          cat > /tmp/engmec-elmer-bin/ElmerSolver <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work \
            ghcr.io/femforge-io/femforge-elmer:0.2.0 ElmerSolver "$@"
          EOF
          chmod +x /tmp/engmec-elmer-bin/*
          echo "/tmp/engmec-elmer-bin" >> "$GITHUB_PATH"
      - name: Testar interface e avaliador
        run: |
          python -m unittest discover -s tests -p 'test_angular_transfinite.py' -v
          python -m unittest discover -s tests -p 'test_aval_ciclo18.py' -v
      - name: Resolver FEM Elmer e SciPy para 8 malhas por d/W
        env:
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          HA="${{ matrix.ha }}"
          H=$(python -c 'import sys; print(.01*int(sys.argv[1]))' "$HA")
          mkdir -p "build/ciclo18/versions-ha-$HA"
          cp pip-freeze-elmer.txt elmer-image-digest.txt "build/ciclo18/versions-ha-$HA/"
          for LW in 2 4; do
            L=$(python -c 'import sys; print(float(sys.argv[1])*int(sys.argv[2]))' "$H" "$LW")
            for n in 24 32 40 48; do
              echo "d/W=1/$HA L/W=$LW n=$n grade angular"
              python -m engmec.elmer_chapa \
                --nr "$n" --nt "$((2*n))" \
                --semilargura-m "$H" --semicomprimento-x-m "$L" \
                --progressao-radial escalonada --distribuicao-angular ampliada-topo \
                --saida "build/ciclo18/ha-$HA-lw-$LW-n-$n"
            done
          done
      - name: Arquivar logs e campos mesmo na falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciclo18-parcial-ha-${{ matrix.ha }}
          path: build/ciclo18/
          retention-days: 30
          if-no-files-found: warn

  consolidar-publicar:
    needs: solver
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[fem2d]"
      - uses: actions/download-artifact@v4
        with:
          pattern: ciclo18-parcial-ha-*
          path: build/ciclo18/
          merge-multiple: true
      - name: Consolidar 16 malhas e comparar 4 gates contra ciclo17
        run: python scripts/avaliar_ciclo18.py --pasta build/ciclo18
      - name: Publicar artefato completo
        uses: actions/upload-artifact@v4
        with:
          name: ciclo18-angular-completo
          path: build/ciclo18/
          retention-days: 30
          if-no-files-found: error
      - name: Versionar JSON verificado apos finalizacao real
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p docs/dados
          cp build/ciclo18/resumo_ciclo18.json docs/dados/ciclo18-angular-2026-11-08.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("docs/dados/ciclo18-angular-2026-11-08.json")
          d=json.loads(p.read_text())
          assert d["ciclo"]==18 and len(d["casos"])==16 and len(d["series"])==4
          assert all(r["qualidade_nova"]["elementos"]==2*r["n"]**2 for r in d["casos"])
          PY
          sha256sum docs/dados/ciclo18-angular-2026-11-08.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dados/ciclo18-angular-2026-11-08.json
          if ! git diff --cached --quiet; then
            git commit -m "data: ciclo18 registrar redistribuicao angular Q8 e resultado negativo auditado"
            git push origin main
          fi
