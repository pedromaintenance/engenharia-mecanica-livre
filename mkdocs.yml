site_name: Engenharia Mecânica Livre
site_description: Acervo técnico público, ferramentas e formação em Engenharia Mecânica
site_url: https://pedromaintenance.github.io/engenharia-mecanica-livre/
repo_url: https://github.com/pedromaintenance/engenharia-mecanica-livre
repo_name: pedromaintenance/engenharia-mecanica-livre
theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    scheme: default
    primary: blue grey
    accent: amber
plugins:
  - search:
      lang:
        - pt
        - en
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
nav:
  - Início: index.md
  - Projeto:
      - Arquitetura: arquitetura.md
      - Método e verificação: metodologia.md
      - Roadmap: roadmap.md
  - Acervo:
      - Fontes prioritárias: fontes.md
      - Trilhas de formação: trilhas.md
  - Fundamentos:
      - Pressão, área e força: conceitos/pressao-forca.md
      - Torque e potência: conceitos/potencia-mecanica.md
  - Aplicações:
      - Ferramentas de cálculo: guia-calculadoras.md
      - Diagnóstico de manutenção: manutencao/diagnostico.md
