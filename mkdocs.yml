site_name: Engenharia Mecânica Livre
site_description: Educação aberta, conhecimento verificável e ferramentas de Engenharia Mecânica
site_url: https://pedromaintenance.github.io/engenharia-mecanica-livre/
repo_url: https://github.com/pedromaintenance/engenharia-mecanica-livre
repo_name: pedromaintenance/engenharia-mecanica-livre
theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    scheme: default
    primary: blue grey
    accent: amber
plugins:
  - search:
      lang: [pt, en]
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
nav:
  - Início: index.md
  - Acervo:
      - Fontes prioritárias: fontes.md
      - Cursos individuais: catalogos/cursos.md
      - Portais e bibliotecas: catalogos/portais.md
      - Ferramentas e simuladores: catalogos/ferramentas.md
  - Formação:
      - Grade aberta: formacao/grade.md
      - Trilhas profissionais: formacao/trilhas.md
      - Trilhas legadas: trilhas.md
  - Fundamentos:
      - Pressão, área e força: conceitos/pressao-forca.md
      - Torque e potência: conceitos/potencia-mecanica.md
      - Esforço normal: conceitos/esforco-normal.md
      - Lei de Hooke axial: conceitos/lei-hooke-axial.md
      - Elemento finito de barra: conceitos/rigidez-elemento-finito.md
      - Convergência FEM: conceitos/convergencia-fem.md
      - Concentração de tensão: conceitos/concentracao-tensao.md
      - Kt bruto e Kt líquido: conceitos/kt-bruto-liquido.md
  - Aplicações:
      - Calculadoras: guia-calculadoras.md
      - Diagnóstico de manutenção: manutencao/diagnostico.md
  - Laboratórios didáticos:
      - Potência hidráulica: laboratorios/potencia-hidraulica.md
      - Condução de calor: laboratorios/conducao.md
      - Frequência natural: laboratorios/vibracoes.md
      - Número de Reynolds: laboratorios/reynolds.md
      - Barra axial FEM: laboratorios/benchmark-barra-fem.md
      - CalculiX tridimensional: laboratorios/calculix-3d.md
      - Flexão pura 3D e convergência: laboratorios/flexao-pura-3d.md
      - C3D8 versus C3D20R: laboratorios/comparar-elementos-fem.md
      - Furo circular — Kirsch: laboratorios/kirsch-furo.md
      - Chapa finita com furo: laboratorios/chapa-finita-furo.md
      - Malhas independentes — Gmsh: laboratorios/gmsh-chapa.md
  - Projeto:
      - Arquitetura: arquitetura.md
      - Método científico: metodologia.md
      - Curadoria e direitos: governanca/curadoria.md
      - Agentes e skills: governanca/agentes.md
      - Descoberta por APIs: governanca/descoberta.md
      - Auditoria de obras: governanca/auditoria-obras.md
      - IA e direitos: governanca/politica-ia.md
  - Roadmaps:
      - Roadmap mestre: roadmaps/master.md
      - Conhecimento: roadmaps/conteudo.md
      - Formação: roadmaps/formacao.md
      - Ferramentas: roadmaps/ferramentas.md
      - Plataforma: roadmaps/plataforma.md
      - Qualidade: roadmaps/qualidade.md
      - Roadmap inicial: roadmap.md
  - Ciclos:
      - Ciclo 02: ciclos/ciclo-02.md
      - Ciclo 03: ciclos/ciclo-03.md
      - Ciclo 04: ciclos/ciclo-04.md
      - Ciclo 05: ciclos/ciclo-05.md
      - Ciclo 06: ciclos/ciclo-06.md
      - Ciclo 07: ciclos/ciclo-07.md
      - Ciclo 08: ciclos/ciclo-08.md
      - Ciclo 09: ciclos/ciclo-09.md
      - Ciclo 10: ciclos/ciclo-10.md
      - Ciclo 11: ciclos/ciclo-11.md
